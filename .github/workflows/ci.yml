# ==============================================================================
# OmniMCP — Continuous Integration & Validation Pipeline
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (for built-in SQLite support)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Type Check (Lint)
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

      - name: Run Core Test Suite (Node.js Test Runner)
        run: npx tsx --test tests/db_profiles_kanban.test.ts tests/profiles_engine.test.ts
        env:
          NODE_ENV: test
          OMNIMCP_OPERATOR_TOKEN: ci_operator_token_test_123456789
          OMNIMCP_AGENT_TOKEN: ci_agent_token_test_123456789

      - name: Run Vitest Suite (including Remote HTTP MCP Transport)
        run: npm test
        env:
          NODE_ENV: test
          OMNIMCP_OPERATOR_TOKEN: ci_operator_token_test_123456789
          OMNIMCP_AGENT_TOKEN: ci_agent_token_test_123456789

  docker:
    name: Docker Image Build & Smoke Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: docker build -t omnimcp:ci .

      - name: Run Container Liveness Smoke Test
        run: |
          docker run -d \
            --name omnimcp-ci-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e NO_BROWSER_OPEN=true \
            -e OMNIMCP_OPERATOR_TOKEN=ci_production_operator_token_test \
            -e OMNIMCP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            omnimcp:ci

          echo "Waiting for container to become healthy..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Container responded with HTTP 200 OK on /health"
              docker logs omnimcp-ci-test
              docker stop omnimcp-ci-test
              exit 0
            fi
            echo "Waiting for /health (attempt $i/30, status: $STATUS)..."
            sleep 1
          done

          echo "Container failed to respond on /health within 30 seconds"
          docker logs omnimcp-ci-test
          docker stop omnimcp-ci-test
          exit 1

